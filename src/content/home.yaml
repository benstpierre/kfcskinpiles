eyebrow: Introducing KFC Skin Piles
headline: ALL SKIN. NO FILLER.
intro: >-
  You know the best bit of fried chicken? We made a whole bucket of it. Crispy,
  craggy, gloriously golden skin. The chicken has been excused.
buckets:
  - name: The Personal Pile
    tagline: A little me-skin time.
    description: >-
      A respectable amount of skin for a deeply unrespectable craving. Sharing
      is a personal failure.
  - name: The Family Pile
    tagline: Brings people together. Briefly.
    description: >-
      Enough golden crunch to start a family tradition. Or a family argument. We
      supply the bucket, you set the boundaries.
  - name: The Skin Situation
    tagline: We have lost control of the pile.
    description: >-
      For game night, big feelings, and people who describe a bucket as a
      serving suggestion. Bring napkins. Cancel plans.
questions:
  - question: So… where is the chicken?
    answer: Taking some well-earned personal time. This is the skin's moment.
  - question: Is this just a bucket of skin?
    answer: We prefer a curated collection of golden, crispy possibilities. But yes.
  - question: Does it come with sides?
    answer: Every piece of skin has two sides. Incredible value.
  - question: Can I actually order this?
    answer: >-
      Only in our dreams. This is an unofficial comedy concept, not an actual
      KFC product or ordering site.
