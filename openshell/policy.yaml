# Candidate for OpenShell v0.0.116; see docs/openshell.md for the live acceptance gate.
# No automatic providers, host mounts, deployment credentials, or inference route.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /bin
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /dev/random
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  codex_account:
    endpoints:
      - host: auth.openai.com
        port: 443
        protocol: tcp
      - host: chatgpt.com
        port: 443
        protocol: tcp
    binaries:
      - path: /usr/local/lib/node_modules/@openai/codex/**/codex
  npm_downloads:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
    binaries:
      - path: /usr/local/bin/node
